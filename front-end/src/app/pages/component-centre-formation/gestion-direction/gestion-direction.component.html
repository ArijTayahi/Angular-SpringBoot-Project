<p-toolbar styleClass="mb-6">
    <ng-template #start>
        <p-button label="New" icon="pi pi-plus" severity="secondary" class="mr-2" (onClick)="openNew()" />
        <p-button severity="secondary" label="Delete" icon="pi pi-trash" outlined  [disabled]="! selectedDirection || ! selectedDirection.length" />
    </ng-template>


    <ng-template #end>
        <p-button label="Export" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
    </ng-template>
</p-toolbar>


<p-table
    #dt
    [value]="directions()"
    [rows]="10"
    [columns]="cols"
    [paginator]="true"
    [globalFilterFields]="['id', 'titre']"
    [tableStyle]="{ 'min-width': '75rem' }"
    [(selection)]=" selectedDirection"
    [rowHover]="true"
    dataKey="id"
    currentPageReportTemplate="Affichage {first} to {last} of {totalRecords} directions"
    [showCurrentPageReport]="true"
    [rowsPerPageOptions]="[10, 20, 30]"
>
    <ng-template #caption>
        <div class="flex items-center justify-between">
            <h5 class="m-0">gestion directions</h5>
            <p-iconfield>
                <p-inputicon styleClass="pi pi-search" />
                <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Search..." />
            </p-iconfield>
        </div>
    </ng-template>
    <ng-template #header>
        <tr>
            <th style="width: 3rem">
                <p-tableHeaderCheckbox />
            </th>
           
            <th pSortableColumn="id" style="min-width:16rem">
                id
                <p-sortIcon field="id" />
            </th>
           
            <th pSortableColumn="titre" style="min-width: 8rem">
                titre
                <p-sortIcon field="titre" />
            </th>
        
           
           
            <th style="min-width: 12rem"></th>
        </tr>
    </ng-template>
    <ng-template #body let-direction>
        <tr>
            <td style="width: 3rem">
                <p-tableCheckbox [value]="direction" />
            </td>
            <td style="min-width: 12rem">{{direction.id }}</td>
            <td style="min-width: 16rem">{{direction.titre }}</td>           
           
            <td>
                <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="editDirection(direction)" />
                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="deleteDirection(direction)" />
            </td>
        </tr>
    </ng-template>
</p-table>


<p-dialog [(visible)]="directionDialog" [style]="{ width: '450px' }" header="direction Details" [modal]="true">
    <ng-template #content>
        <div class="flex flex-col gap-6">
           
            <div>
                <label for="name" class="block font-bold mb-3">titre</label>
                <input type="text" pInputText id="name" [(ngModel)]="direction.titre" required autofocus fluid />
                <small class="text-red-500" *ngIf="submitted && !direction.titre">titre is required.</small>
            </div>
           
        </div>
    </ng-template>


    <ng-template #footer>
        <p-button label="Cancel" icon="pi pi-times" text (click)="hideDialog()" />
        <p-button *ngIf="submittedaddnew" label="Save" icon="pi pi-check" (click)="saveDirection()" />
        <p-button *ngIf="submittedupdate" label="update" icon="pi pi-check" (click)="saveDirection()" />
    </ng-template>
   
</p-dialog>


<p-confirmdialog [style]="{ width: '450px' }" />
